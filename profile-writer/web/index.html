<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Noora Profile Writer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: inbox · chat · Copilot panel, like a nurse's WhatsApp helpdesk. WhatsApp's own greens and off-whites. */
:root{
  --top:#008069; --top-ink:#ffffff; --green:#00a884; --green-ink:#ffffff; --badge:#25d366;
  --page:#f0f2f5; --panel:#ffffff; --bar:#f0f2f5; --line:#e9edef; --hover:#f5f6f6; --sel:#f0f2f5;
  --ink:#111b21; --ink-2:#3b4a54; --meta:#667781;
  --chat:#efeae2; --in:#ffffff; --out:#d9fdd3; --tick:#53bdeb;
  --sysnote:#e1f3fb; --sysnote-ink:#3b4a54; --tab-on:#e7f6ef;
  --amber:#b45f06; --amber-soft:#fff4e0; --amber-line:#f5d49a;
  --red:#c23934; --red-soft:#fdecea; --red-line:#f1b5b1;
  --draft:#f3fbf6; --draft-line:#bfe6d1; --mark:#fff3a3;
  --shadow:0 1px 0.5px rgba(11,20,26,.13);
  --font: "Segoe UI", "Helvetica Neue", Helvetica, "Noto Sans", "Noto Sans Devanagari", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --top:#202c33; --top-ink:#e9edef; --green:#00a884; --green-ink:#111b21; --badge:#00a884;
  --page:#0b141a; --panel:#111b21; --bar:#202c33; --line:#222d34; --hover:#202c33; --sel:#2a3942;
  --ink:#e9edef; --ink-2:#d1d7db; --meta:#8696a0;
  --chat:#0b141a; --in:#202c33; --out:#005c4b; --tick:#53bdeb;
  --sysnote:#182229; --sysnote-ink:#8696a0; --tab-on:#1d3a33;
  --amber:#f2b25c; --amber-soft:#2b2416; --amber-line:#5a4521;
  --red:#f3807a; --red-soft:#2d1a1a; --red-line:#5c2a28;
  --draft:#132620; --draft-line:#1f4a3b; --mark:#5b4d10;
  --shadow:0 1px 0.5px rgba(0,0,0,.4);
  color-scheme: dark;
}}
:root[data-theme="dark"]{
  --top:#202c33; --top-ink:#e9edef; --green:#00a884; --green-ink:#111b21; --badge:#00a884;
  --page:#0b141a; --panel:#111b21; --bar:#202c33; --line:#222d34; --hover:#202c33; --sel:#2a3942;
  --ink:#e9edef; --ink-2:#d1d7db; --meta:#8696a0;
  --chat:#0b141a; --in:#202c33; --out:#005c4b; --tick:#53bdeb;
  --sysnote:#182229; --sysnote-ink:#8696a0; --tab-on:#1d3a33;
  --amber:#f2b25c; --amber-soft:#2b2416; --amber-line:#5a4521;
  --red:#f3807a; --red-soft:#2d1a1a; --red-line:#5c2a28;
  --draft:#132620; --draft-line:#1f4a3b; --mark:#5b4d10;
  --shadow:0 1px 0.5px rgba(0,0,0,.4);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.4 var(--font)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--top)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%}

/* top bar */
.topbar{display:flex;align-items:center;gap:12px;height:56px;flex:none;background:var(--top);color:var(--top-ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;letter-spacing:.01em}
.brand svg{width:26px;height:26px}
.topbar .grow{flex:1}
.iconbtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:inherit}
.iconbtn:hover{background:rgba(127,127,127,.15)}
.iconbtn svg{width:20px;height:20px}
.me{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2);font-size:11px;font-weight:600}

/* three panes */
.shell{flex:1;min-height:0;display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr) minmax(300px,380px)}
.pane{min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--panel)}
.inbox{border-right:1px solid var(--line)}
.copilot{border-left:1px solid var(--line);background:var(--page)}

/* inbox */
.inbox-head{padding:8px 12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;background:var(--bar);border-radius:8px;padding:7px 12px;color:var(--meta)}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;color:var(--ink)}
.filters{display:flex;gap:6px}
.chip{border:0;border-radius:999px;padding:5px 12px;background:var(--bar);color:var(--meta);font-size:13px}
.chip.on{background:var(--tab-on);color:var(--green);font-weight:600}
.list{flex:1;overflow:auto}
.row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border:0;border-bottom:1px solid var(--line);
  background:transparent;width:100%;text-align:left}
.row:hover{background:var(--hover)} .row.on{background:var(--sel)}
.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;font-size:17px;flex:none}
.row .nm{font-size:16px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pv{font-size:13.5px;color:var(--meta);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pv svg{width:16px;height:11px;color:var(--tick);vertical-align:-1px}
.row .pv.busy{color:var(--green);font-style:italic}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:12px;color:var(--meta)}
.row .side.unread{color:var(--badge)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--badge);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center}
.flag{font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber-line)}
.flag.red{background:var(--red-soft);color:var(--red);border-color:var(--red-line)}
.inbox-foot{border-top:1px solid var(--line);padding:10px 12px}
.ghost{display:flex;align-items:center;gap:8px;width:100%;justify-content:center;border:1px dashed var(--line);border-radius:8px;background:transparent;
  color:var(--meta);padding:8px;font-size:13px}
.ghost:hover{color:var(--green);border-color:var(--green)}
.ghost svg{width:16px;height:16px}

/* chat */
.chat{background:var(--chat)}
.chat-head{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--bar);border-bottom:1px solid var(--line);min-height:60px}
.chat-head .avatar{width:40px;height:40px;font-size:15px}
.chat-head .nm{font-weight:500;font-size:16px}
.chat-head .sub{font-size:13px;color:var(--meta)}
.chat-head .sub.busy{color:var(--green)}
.msgs{flex:1;overflow:auto;padding:16px 6%;display:flex;flex-direction:column;gap:3px}
.day{align-self:center;margin:10px 0 6px;background:var(--panel);color:var(--meta);font-size:12.5px;padding:5px 12px;border-radius:8px;box-shadow:var(--shadow);text-transform:uppercase}
.b{max-width:min(65%,520px);padding:6px 8px 4px 9px;border-radius:8px;box-shadow:var(--shadow);white-space:pre-wrap;word-wrap:break-word;font-size:14.2px}
.b.in{background:var(--in);align-self:flex-start;border-top-left-radius:0}
.b.out{background:var(--out);align-self:flex-end;border-top-right-radius:0}
.b .t{float:right;margin:6px 0 -4px 10px;font-size:11px;color:var(--meta);display:inline-flex;gap:3px;align-items:center}
.b .t svg{width:16px;height:11px;color:var(--tick)}
.stk{align-self:flex-end;display:flex;flex-direction:column;align-items:flex-end;gap:2px;margin:2px 0}
.stk img{width:150px;height:150px;display:block}
.stk .t{font-size:11px;color:var(--meta);background:var(--panel);border-radius:6px;padding:1px 6px;box-shadow:var(--shadow)}
.draft .stkprev{width:84px;height:84px;display:block;margin:2px 0 6px}
.attach{display:flex;align-items:center;gap:8px;padding:6px 12px 0;background:var(--bar)}
.attach img{width:52px;height:52px}
.attach .x{border:0;background:none;color:var(--meta);font-size:18px;cursor:pointer;line-height:1}
.sys{align-self:center;max-width:80%;margin:6px 0;background:var(--sysnote);color:var(--sysnote-ink);font-size:12.5px;padding:5px 12px;border-radius:8px;
  box-shadow:var(--shadow);text-align:center}
.sys.alert{background:var(--red-soft);color:var(--red);border:1px solid var(--red-line);font-weight:500}
.typing{align-self:flex-start;background:var(--in);border-radius:8px;border-top-left-radius:0;box-shadow:var(--shadow);padding:8px 12px;color:var(--meta);font-size:13px;
  display:flex;align-items:center;gap:8px;margin-top:4px}
.dots{display:inline-flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--meta);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.empty-chat{margin:auto;color:var(--meta);text-align:center}

.draft{margin:0 12px 8px;background:var(--draft);border:1px solid var(--draft-line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.draft .hd{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--green);font-weight:600}
.draft .hd .lang{font-weight:400;color:var(--meta)}
.draft .hd .grow{flex:1}
.draft .tx{white-space:pre-wrap;font-size:14px}
.draft .acts{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:6px 14px;font-size:13px}
.btn:hover{border-color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink);font-weight:600}
.btn.danger{color:var(--red);border-color:var(--red-line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.composer{display:flex;align-items:flex-end;gap:8px;padding:8px 12px;background:var(--bar);
  padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
.composer textarea{flex:1;min-width:0;border:0;border-radius:8px;background:var(--panel);padding:10px 12px;resize:none;max-height:140px;outline:none;line-height:1.35}
.send{width:42px;height:42px;border-radius:50%;border:0;background:var(--green);color:var(--green-ink);display:grid;place-items:center;flex:none}
.send svg{width:20px;height:20px}
.send:disabled{opacity:.5}

/* Copilot panel */
.cp-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border-bottom:1px solid var(--line)}
.cp-tabs button{border:0;background:transparent;padding:13px 8px;color:var(--meta);font-weight:500}
.cp-tabs button.on{background:var(--tab-on);color:var(--ink);font-weight:600}
.cp-body{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card h3{margin:0;font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .grow{flex:1}
.card .toggle{border:0;background:transparent;color:var(--meta);padding:2px;display:grid}
.bio-top{display:flex;align-items:center;gap:8px;color:var(--meta);font-size:13.5px}
.bio-top .grow{flex:1}
.bio{font-size:15px;line-height:1.5;margin:8px 0 0}
.bio.loading{color:var(--meta);font-style:italic}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;row-gap:9px;margin:10px 0 0;font-size:14px}
.kv dt{color:var(--meta)}
.kv dd{margin:0;text-align:right;color:var(--ink);min-width:0;border-radius:4px}
.kv dd .src{display:block;font-size:11.5px;color:var(--green);margin-top:1px}
.kv dd.flash{animation:flash 2.5s ease-out}
@keyframes flash{0%{background:var(--mark)}100%{background:transparent}}
.need{border-color:var(--amber-line);background:var(--amber-soft)}
.need.red{border-color:var(--red-line);background:var(--red-soft)}
.need h3{color:var(--amber)} .need.red h3{color:var(--red)}
.item{border-top:1px solid var(--amber-line);padding-top:10px;margin-top:10px;display:flex;flex-direction:column;gap:6px}
.need.red .item{border-color:var(--red-line)}
.item .what{font-size:14px}
.item .what b{font-weight:600}
.item .q{font-size:13px;color:var(--ink-2)}
.item .q mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.item .why{font-size:12.5px;color:var(--meta)}
.item .acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.item select,.item input{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--panel);font-size:13px;min-width:0}
.muted{color:var(--meta);font-size:13px}

/* processing tab */
.steps{display:flex;flex-direction:column;gap:12px}
.st{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px}
.st .dot{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--green)}
.st .dot.red{background:var(--red)} .st .dot.grey{background:var(--meta)}
.st .ttl{font-weight:600;font-size:13.5px}
.st .sub{font-size:13px;color:var(--ink-2)}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.pill.write{background:var(--draft);color:var(--green);border:1px solid var(--draft-line)}
.pill.nurse,.pill.ask_family{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber-line)}
.pill.clinical{background:var(--red-soft);color:var(--red);border:1px solid var(--red-line)}
.pill.discard,.pill.same,.pill.shadow{background:var(--bar);color:var(--meta);border:1px solid var(--line)}
details{font-size:13px;margin-top:6px}
details summary{cursor:pointer;color:var(--green)}
pre{font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--bar);border-radius:8px;padding:8px;white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto;margin:6px 0}

/* popovers */
.pop{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(11,20,26,.22);padding:14px;
  width:min(380px,calc(100vw - 32px));max-height:calc(100vh - 120px);overflow:auto;display:flex;flex-direction:column;gap:10px}
.pop h4{margin:0;font-size:15px;display:flex;align-items:center}
.pop h4 .grow{flex:1}
.pop label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--meta)}
.pop input,.pop select,.pop textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--page);color:var(--ink)}
.pop textarea{resize:vertical;min-height:64px}
.pop .row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pop .chips{display:flex;flex-direction:column;gap:6px}
.pop .chips button{border:1px solid var(--line);background:var(--page);border-radius:8px;padding:7px 10px;text-align:left;font-size:13px;color:var(--ink-2)}
.pop .chips button:hover{border-color:var(--green)}
#simPop{left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px))}
#setPop{right:max(16px,env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px))}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:8px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:calc(100vw - 32px)}
.toast.on{opacity:1}
[hidden]{display:none!important}

/* narrow screens: stack the panes */
@media (max-width: 900px){
  html,body{height:auto}
  .app{height:auto}
  .shell{grid-template-columns:minmax(0,1fr)}
  .pane{min-height:auto}
  .inbox{max-height:40vh;border-right:0;border-bottom:1px solid var(--line)}
  .chat{height:80vh}
  .copilot{border-left:0}
  .msgs{padding:12px}
  .b{max-width:85%}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16 3C8.8 3 3 8.4 3 15.1c0 2.6.9 5 2.4 7L4 28l6.3-1.6c1.7.8 3.6 1.2 5.7 1.2 7.2 0 13-5.4 13-12.1S23.2 3 16 3z"/><path d="M11 14h10M11 18.5h6" stroke="var(--top)" stroke-width="2.2" stroke-linecap="round"/></svg>
      Care Companion
    </div>
    <span class="grow"></span>
    <button class="iconbtn" id="setBtn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <div class="me" title="Signed in as MSE">MSE</div>
  </header>

  <div class="shell">
    <aside class="pane inbox" aria-label="Chats">
      <div class="inbox-head">
        <label class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Search chats" autocomplete="off">
        </label>
        <div class="filters">
          <button class="chip on" data-filter="all" id="fAll">All</button>
          <button class="chip" data-filter="needs" id="fNeeds">Needs check</button>
        </div>
      </div>
      <div class="list" id="list"></div>
      <div class="inbox-foot">
        <button class="ghost" id="simBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg>
          Family phone
        </button>
      </div>
    </aside>

    <section class="pane chat" aria-label="Conversation">
      <div class="chat-head" id="chatHead"></div>
      <div class="msgs" id="msgs"></div>
      <div id="draftBox"></div>
      <div id="attach"></div>
      <div class="composer">
        <textarea id="reply" rows="1" placeholder="Type a message"></textarea>
        <button class="send" id="sendBtn" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
        </button>
      </div>
    </section>

    <aside class="pane copilot" aria-label="Copilot">
      <div class="cp-tabs">
        <button class="on" data-tab="profile" id="tProfile">User Profile</button>
        <button data-tab="how" id="tHow">How it was processed</button>
      </div>
      <div class="cp-body" id="cpProfile"></div>
      <div class="cp-body" id="cpHow" hidden></div>
    </aside>
  </div>
</div>

<div class="pop" id="simPop" hidden>
  <h4><span class="grow" id="simTitle">Family phone</span><button class="iconbtn" id="simClose" aria-label="Close" style="color:var(--meta)">✕</button></h4>
  <textarea id="simText" placeholder="Message from the family"></textarea>
  <div class="row2"><button class="btn primary" id="simSend">Send</button><span class="muted" id="simNote"></span></div>
  <div class="chips" id="simChips"></div>
</div>

<div class="pop" id="setPop" hidden>
  <h4><span class="grow">Settings</span><button class="iconbtn" id="setClose" aria-label="Close" style="color:var(--meta)">✕</button></h4>
  <div id="setBody" style="display:flex;flex-direction:column;gap:10px"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
// All message text is inserted with textContent, never innerHTML.
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()){ if (kid == null || kid === false) continue; el.append(kid instanceof Node ? kid : document.createTextNode(String(kid))); }
  return el;
}
const svg = (markup) => { const t = document.createElement("template"); t.innerHTML = markup.trim(); return t.content.firstChild; }; // fixed icons only
const TICKS = '<svg viewBox="0 0 16 11" fill="currentColor"><path d="M11.1.7 5.3 7.9 2.9 5.6 2 6.6l3.4 3.3 6.6-8.2zM15 .7 9.2 7.9l-.6-.6-.9 1 1.6 1.6 6.6-8.2z"/></svg>';
const REFRESH = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>';
const UP = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 15 6-6 6 6"/></svg>';
const DOWN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>';
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("on"),2800); }
function sget(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } }
function sset(k,v){ try { v==null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k,v); } catch(e){} }

const AV = ["#00a884","#3d9ee0","#a17fd1","#d9902a","#e2665f","#3f9fa1","#7b8fd6"];
function avatar(name){ const n=(name||"?").trim(); let x=0; for (const c of n) x=(x*31+c.charCodeAt(0))>>>0;
  const ini = n.split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase(); return h("div",{class:"avatar", style:`background:${AV[x%AV.length]}`}, ini); }
function hhmm(ts){ const d=new Date(ts); return isNaN(d) ? "" : d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}); }
function dayLabel(ts){ const d=new Date(ts), t=new Date(); if (isNaN(d)) return "";
  const y=new Date(t); y.setDate(t.getDate()-1);
  if (d.toDateString()===t.toDateString()) return "Today"; if (d.toDateString()===y.toDateString()) return "Yesterday";
  return d.toLocaleDateString("en-GB", {day:"2-digit", month:"2-digit", year:"numeric"}); }
function listTime(ts){ const l=dayLabel(ts); return l==="Today" ? hhmm(ts) : l; }
function highlight(text, quote){ text=text||""; if(!quote) return [text]; const i=text.toLowerCase().indexOf(quote.toLowerCase());
  return i<0 ? [text] : [text.slice(0,i), h("mark",{}, text.slice(i,i+quote.length)), text.slice(i+quote.length)]; }

// ------------------------------------------------------------------ data
// MODE: "local" (page served by the server) · "remote" (hosted page + server address/token) · "offline" (recorded run, no server)
let MODE=null, CONN={base:"",token:""}, S=null, uid=null, filter="all", query="", cpTab="profile";
let OFF=null;           // offline: {families, chats, scripts, used, local}
const SUGGEST = {};     // family name → suggested messages (from the recording)

let STICKER=null, stickerTried=false, withSticker={};   // demo sticker: blob URL, and whether the next reply carries it (per chat)
async function stickerURL(){
  if (STICKER || stickerTried || MODE==="offline" || !(S && S.config && S.config.demo_sticker)) return STICKER;
  stickerTried = true;
  try { const r = await fetch(CONN.base+"/sticker.webp", {headers:headers()}); if (r.ok) STICKER = URL.createObjectURL(await r.blob()); } catch(e){}
  if (STICKER) render();
  return STICKER;
}
function stickerImg(cls){ if (!STICKER){ stickerURL(); return null; } return h("img",{src:STICKER, class:cls||"", alt:"Sticker: let me stop you right there"}); }
function headers(extra){ const hd=Object.assign({}, extra||{}); if (MODE==="remote"){ hd.Authorization="Bearer "+CONN.token; hd["ngrok-skip-browser-warning"]="1"; } return hd; }
async function post(path, body){
  const r = await fetch(CONN.base+path, {method:"POST", headers:headers({"Content-Type":"application/json","X-NPW":"1"}), body:JSON.stringify(body||{})});
  const j = await r.json().catch(()=>({})); if (!r.ok) throw new Error(j.error || ("HTTP "+r.status)); return j;
}
async function load(){
  if (MODE==="offline"){ S = offlineState(); render(); return; }
  const r = await fetch(CONN.base+"/api/state"+(uid?"?uid="+encodeURIComponent(uid):""), {headers:headers()});
  if (r.status===401){ toast("The server refused the access token."); return startOffline(); }
  S = await r.json(); uid = S.uid; render();
}

// ------------------------------------------------------------------ offline demo: recorded results of the real pipeline
async function startOffline(){
  MODE="offline"; stopEvents();
  if (!OFF){
    let data=null; const emb=document.getElementById("demo-data");
    try { data = emb ? JSON.parse(emb.textContent) : await (await fetch("demo.json",{cache:"no-store"})).json(); }
    catch(e){ $("#msgs").replaceChildren(h("div",{class:"empty-chat"},"Couldn't load the demo.")); return; }
    OFF = {families:data.families, chats:data.chats, scripts:data.scripts, used:{}, local:{}};
    for (const f of data.families) SUGGEST[f.name] = (data.scripts[f.uid]||[]).map(s=>s.text);
  }
  uid = uid && OFF.chats[uid] ? uid : OFF.families[0].uid; load();
}
function offlineState(){
  const fams = OFF.families.map(f=>({...f})).sort((a,b)=>(b.last_ts||"").localeCompare(a.last_ts||""));
  const base = OFF.chats[uid];
  const chat = base ? {...base, messages:[...base.messages, ...(OFF.local[uid]||[])].sort((a,b)=>a.ts.localeCompare(b.ts))} : null;
  return {config:{}, families:fams, uid, chat};
}
function offlineSendFamily(i){
  const sc = (OFF.scripts[uid]||[])[i]; if (!sc) return;
  const id = uid; (OFF.used[id] = OFF.used[id]||new Set()).add(i);
  const ts = new Date().toISOString(), fam = OFF.families.find(f=>f.uid===id);
  OFF.chats[id] = {...OFF.chats[id], processing:true, draft:"", messages:[...OFF.chats[id].messages, {id:"o"+Date.now(), dir:"in", text:sc.text, ts}]};
  Object.assign(fam, {processing:true, last:sc.text, last_ts:ts, last_out:false, unread: id===uid ? 0 : (fam.unread||0)+1});
  load();
  setTimeout(()=>{ // swap in what the real pipeline produced for this exact message, re-timed to now
    const after = JSON.parse(JSON.stringify(sc.chat));
    const lastIn = [...after.messages].reverse().find(m=>m.dir==="in");
    const shift = Date.now() - new Date(lastIn ? lastIn.ts : Date.now()).getTime();
    const cutoff = lastIn ? new Date(lastIn.ts).getTime() - 60e3 : 0;
    const now = Date.now();
    for (const arr of [after.messages, after.notices]) for (const m of arr){ const t=new Date(m.ts).getTime(); if (t >= cutoff) m.ts = new Date(Math.min(t+shift, now)).toISOString(); }
    OFF.chats[id] = after; Object.assign(fam, sc.family, {last:sc.text, last_ts:ts, processing:false, unread: id===uid ? 0 : fam.unread});
    load();
  }, 2800);
}
function offlineAct(n, action, value){
  const c = OFF.chats[uid], fam = OFF.families.find(f=>f.uid===uid);
  c.needs = c.needs.filter(x=>x.id!==n.id);
  if (n.signal === "sensitive_event"){ c.paused = false; }
  else if (action === "confirm" || action === "correct"){
    const v = action==="correct" ? value : n.value;
    const pretty = n.signal==="phone_holder" ? ({mother:"Mother",husband:"Husband",mother_in_law:"Mother-in-law",other_family:"Other family"}[v]||v)
                 : /^\d{4}-\d{2}-\d{2}$/.test(v) ? v.split("-").reverse().join("/") : v;
    const field = n.signal==="phone_holder" ? "Who holds the phone" : n.label;
    const row = c.health.find(r=>r.field===field); if (row){ row.value = pretty; row.from = "nurse"; row.quote = n.quote; }
    c.notices = [...c.notices, {ts:new Date().toISOString(), text:`Profile updated by nurse · ${field}: ${pretty}`}];
  }
  fam.needs = c.needs.length; fam.clinical = c.needs.some(x=>x.lane==="clinical");
  load();
}

// ------------------------------------------------------------------ rendering
function render(){ if (!S) return; renderList(); renderChat(); renderCopilot(); renderHow(); }
function renderList(){
  const box=$("#list"); box.replaceChildren();
  const needsN = S.families.filter(f=>f.needs || f.alert).length;
  $("#fNeeds").textContent = needsN ? `Needs check (${needsN})` : "Needs check";
  const fams = S.families.filter(f => (filter==="all" || f.needs || f.alert) && (!query || f.name.toLowerCase().includes(query)));
  if (!fams.length) box.append(h("p",{class:"muted", style:"padding:16px"}, filter==="needs" ? "Nothing waiting for you." : "No chats."));
  for (const f of fams){
    const unread = f.uid!==uid && f.unread>0;
    box.append(h("button",{class:"row"+(f.uid===uid?" on":""), onclick:()=>select(f.uid)},
      avatar(f.name),
      h("div",{style:"min-width:0"}, h("div",{class:"nm"}, f.name),
        f.processing ? h("div",{class:"pv busy"}, "Copilot is reading…")
                     : h("div",{class:"pv"}, f.last_out ? svg(TICKS) : null, f.last_out ? " " : "", f.last || "")),
      h("div",{class:"side"+(unread?" unread":"")}, listTime(f.last_ts),
        f.alert ? h("span",{class:"flag red"}, f.alert)
          : f.needs ? h("span",{class:"flag"+(f.clinical?" red":"")}, f.clinical ? "Clinical" : "Check") : null,
        unread ? h("span",{class:"badge"}, f.unread) : null)));
  }
}
function renderChat(){
  const c = S.chat, head=$("#chatHead"), box=$("#msgs");
  head.replaceChildren(); box.replaceChildren();
  if (!c){ box.append(h("div",{class:"empty-chat"},"Select a chat")); $("#draftBox").replaceChildren(); return; }
  head.append(avatar(c.name), h("div",{}, h("div",{class:"nm"}, c.name),
    c.processing ? h("div",{class:"sub busy"},"Copilot is reading the latest message…") : h("div",{class:"sub"}, c.phone)));
  const items = [...c.messages.map(m=>({k:"m", ts:m.ts, m})), ...c.notices.map(n=>({k:"n", ts:n.ts, n}))]
    .sort((a,b)=> (a.ts||"").localeCompare(b.ts||"") || (a.k===b.k ? (a.k==="m" ? (a.m.id>b.m.id?1:-1) : 0) : a.k==="m"?-1:1));
  let lastDay = "";
  for (const it of items){
    const d = dayLabel(it.ts); if (d && d!==lastDay){ box.append(h("div",{class:"day"}, d)); lastDay = d; }
    if (it.k==="n"){ box.append(h("div",{class:"sys"+(it.n.alert?" alert":"")}, it.n.text)); continue; }
    const m = it.m;
    if (m.sticker){ box.append(h("div",{class:"stk"}, stickerImg() || h("div",{class:"b out"}, "Sticker"), h("span",{class:"t"}, hhmm(m.ts)))); continue; }
    box.append(h("div",{class:"b "+m.dir}, m.text, h("span",{class:"t"}, m.auto ? "Automatic · " : "", hhmm(m.ts), m.dir==="out" ? svg(TICKS) : null)));
  }
  if (c.processing) box.append(h("div",{class:"typing"}, h("span",{class:"dots"}, h("i"),h("i"),h("i")), "Copilot is reading"));
  box.scrollTop = box.scrollHeight;
  renderDraft();
}
let dismissed = {};
function renderDraft(){
  const c=S.chat, box=$("#draftBox"); box.replaceChildren();
  if (!c || c.processing || !c.draft || dismissed[uid]===c.draft) return;
  const lang = {hindi_roman:"Hindi", hindi_devanagari:"Hindi", english:"English"}[c.draft_language] || "";
  box.append(h("div",{class:"draft"},
    h("div",{class:"hd"}, "Copilot suggestion", lang ? h("span",{class:"lang"}, "· "+lang) : null, h("span",{class:"grow"}),
      h("button",{class:"btn", onclick:()=>{ dismissed[uid]=c.draft; renderDraft(); }}, "Dismiss")),
    c.draft_sticker ? stickerImg("stkprev") : null,
    h("div",{class:"tx"}, c.draft),
    h("div",{class:"acts"}, h("button",{class:"btn primary", onclick:()=>{ const t=$("#reply"); t.value=c.draft; autosize(t); t.focus();
      if (c.draft_sticker){ withSticker[uid]=true; renderAttach(); } }}, "Use reply"))));
}
function renderCopilot(){
  const c=S.chat, box=$("#cpProfile"); box.replaceChildren();
  if (!c) return;
  const clinical = c.needs.filter(n=>n.lane==="clinical"), check = c.needs.filter(n=>n.lane!=="clinical");
  if (clinical.length) box.append(needCard(clinical, true));
  if (check.length) box.append(needCard(check, false));
  box.append(h("div",{class:"card"},
    h("div",{class:"bio-top"}, h("span",{class:"grow"}, c.phone),
      h("button",{class:"iconbtn", title:"Refresh summary", "aria-label":"Refresh summary", style:"width:28px;height:28px;color:var(--meta)", onclick:refreshBio}, svg(REFRESH))),
    c.bio ? h("p",{class:"bio"}, c.bio) : h("p",{class:"bio loading"}, c.processing ? "Updating summary…" : "Writing summary…")));
  box.append(kvCard("User details", c.details, "details"));
  box.append(kvCard("Health Information", c.health, "health"));
  box.append(h("div",{class:"card"}, h("h3",{}, "Notes"), h("p",{class:"muted", style:"margin:8px 0 0"}, "No notes available")));
}
const collapsed = {};
let prevVals = {};
function kvCard(title, rows, key){
  const dl = h("dl",{class:"kv"});
  for (const r of rows){
    const sig = uid+key+r.field, changed = prevVals[sig] !== undefined && prevVals[sig] !== r.value && r.value !== "-";
    prevVals[sig] = r.value;
    dl.append(h("dt",{}, r.field), h("dd",{class: changed ? "flash" : "", title: r.quote ? `“${r.quote}”` : ""}, r.value || "-",
      r.from === "chat" ? h("span",{class:"src"}, "from chat") : r.from === "nurse" ? h("span",{class:"src"}, "confirmed by nurse") : null));
  }
  const card = h("div",{class:"card"}, h("h3",{}, h("span",{class:"grow"}, title),
    h("button",{class:"toggle", "aria-label": collapsed[key] ? "Expand" : "Collapse", onclick:()=>{ collapsed[key]=!collapsed[key]; renderCopilot(); }}, svg(collapsed[key] ? DOWN : UP))));
  if (!collapsed[key]) card.append(dl);
  return card;
}
function needCard(items, red){
  const card = h("div",{class:"card need"+(red?" red":"")}, h("h3",{}, red ? "Clinical review" : "Check before saving"));
  for (const n of items){
    const it = h("div",{class:"item"});
    if (n.signal === "sensitive_event"){
      it.append(h("div",{class:"what"}, h("b",{}, "Possible pregnancy loss")),
        n.message ? h("div",{class:"q"}, "“", n.message, "”") : null,
        h("div",{class:"why"}, "Automatic profile updates are paused for this family."),
        h("div",{class:"acts"}, h("button",{class:"btn primary", onclick:()=>act(n,"dismiss")}, "Mark reviewed")));
    } else {
      const ENUM = {phone_holder:["mother","husband","mother_in_law","other_family"], stage:["pregnant","delivered"]};
      const edit = ENUM[n.signal] ? h("select",{"aria-label":"New value"}, ENUM[n.signal].map(v=>h("option",{value:v, selected: v===n.value?"":false}, v.replace(/_/g,"-"))))
                                  : h("input",{type:"date", value:n.value || "", "aria-label":"New date"});
      edit.hidden = true;
      const save = h("button",{class:"btn primary", onclick:()=>act(n,"correct",edit.value)}, "Save"); save.hidden = true;
      it.append(h("div",{class:"what"}, n.label, ": ", h("b",{}, n.pretty)),
        n.message ? h("div",{class:"q"}, "“", ...highlight(n.message, n.quote), "”") : null,
        n.reason ? h("div",{class:"why"}, n.reason) : null,
        h("div",{class:"acts"},
          h("button",{class:"btn primary", onclick:()=>act(n,"confirm")}, "Confirm"),
          h("button",{class:"btn", onclick:()=>{ edit.hidden=!edit.hidden; save.hidden=edit.hidden; }}, "Edit"),
          h("button",{class:"btn", onclick:()=>act(n,"dismiss")}, "Not correct"), edit, save));
    }
    card.append(it);
  }
  return card;
}
const ROUTE = {write:"Saved", nurse:"Sent to nurse", clinical:"Clinical review", ask_family:"Ask family", discard:"Not saved", same:"Already known", shadow:"Logged only"};
const SIG = {phone_holder:"Who holds the phone", stage:"Stage", baby_dob:"Baby DOB", due_date:"Due date"};
function renderHow(){
  const box=$("#cpHow"); box.replaceChildren();
  const t = S.chat && S.chat.trace;
  if (!t){ box.append(h("p",{class:"muted"},"Nothing processed for this chat yet.")); return; }
  const st = Object.fromEntries((t.steps||[]).map(s=>[s.step, s]));
  const msg = (S.chat.messages.find(m=>m.id===t.message_id)||{}).text || "";
  const steps = h("div",{class:"steps"});
  const add = (cls, ttl, ...sub) => steps.append(h("div",{class:"st"}, h("span",{class:"dot "+cls}), h("div",{style:"min-width:0"}, h("div",{class:"ttl"}, ttl), ...sub)));
  add("", "Message received", msg ? h("div",{class:"sub"}, "“"+msg+"”") : null,
    st.privacy && st.privacy.removed && st.privacy.removed.length ? h("div",{class:"sub"}, "Removed before analysis: " + st.privacy.removed.join(", ")) : null);
  if (st.skipped) add("grey", "Not processed", h("div",{class:"sub"}, st.skipped.reason));
  if (st.guards && (st.guards.loss_words || st.guards.emergency_words || st.guards.instruction_like))
    add("red", "Flagged", h("div",{class:"sub"}, [st.guards.loss_words && "possible pregnancy loss", st.guards.emergency_words && "danger signs", st.guards.instruction_like && "instruction-like text"].filter(Boolean).join(" · ")));
  const decs = t.decisions || [];
  if (st.extractor) add("", decs.length ? `${decs.length} fact${decs.length>1?"s":""} found` : "No profile facts in this message",
    ...decs.map(d => h("div",{class:"sub", style:"margin-top:8px"}, h("span",{class:"pill "+d.route}, ROUTE[d.route]||d.route),
      h("b",{}, SIG[d.signal]||d.signal), ": ", d.value || "-",
      d.proposal && d.proposal.evidence ? h("div",{class:"muted"}, "“"+d.proposal.evidence+"”") : null,
      h("div",{class:"muted"}, `Rules: ${d.checks.filter(c=>c.ok).length}/${d.checks.length} passed` + (d.judgement && d.judgement.verdict ? ` · AI judge: ${d.judgement.verdict}` : "")),
      d.judgement && d.judgement.reason ? h("div",{class:"muted"}, d.judgement.reason) : null)));
  const out = st.outcome;
  if (out){
    const ca = out.condition_area || {};
    add(out.upe_write ? "" : "grey", out.upe_write ? "Profile updated" : "Profile unchanged",
      ca.from && ca.from !== ca.to ? h("div",{class:"sub"}, `Condition area ${ca.from} → ${ca.to}, written with the baby's DOB`) : null);
  }
  if (st.copilot) add("", "Summary and reply drafted", h("div",{class:"sub"}, "The nurse edits and sends the reply."));
  box.append(h("div",{class:"card"}, steps,
    h("details",{}, h("summary",{},"Sent to the model"), h("pre",{}, (st.extractor && st.extractor.sent) || "-")),
    out && out.upe_write ? h("details",{}, h("summary",{},"Profile write record"), h("pre",{}, JSON.stringify(out.upe_write, null, 1))) : null,
    st.judge ? h("details",{}, h("summary",{},"AI judge answers"), h("pre",{}, JSON.stringify(st.judge.verdicts, null, 1))) : null,
    h("p",{class:"muted", style:"margin:10px 0 0"}, `Processed in ${((t.total_ms||0)/1000).toFixed(1)} s`)));
}

// ------------------------------------------------------------------ actions
async function select(id){
  uid = id; $("#reply").value=""; autosize($("#reply")); prevVals = {}; renderAttach();
  if (MODE==="offline"){ const f=OFF.families.find(x=>x.uid===id); if (f) f.unread=0; }
  else { post("/api/read",{uid:id}).catch(()=>{}); }
  await load(); renderSim();
}
async function act(n, action, value){
  if (action==="correct" && !value){ toast("Choose a value first"); return; }
  const done = action==="dismiss" ? (n.signal==="sensitive_event" ? "Marked reviewed" : "Not saved") : "Saved to profile";
  if (MODE==="offline"){ offlineAct(n, action, value); toast(done); return; }
  try { await post("/api/review",{fact_id:n.id, action, value}); toast(done); } catch(e){ toast(e.message); }
  load();
}
function renderAttach(){
  const box=$("#attach"); box.replaceChildren();
  if (!uid || !withSticker[uid] || !STICKER) return;
  box.append(h("div",{class:"attach"}, stickerImg(), h("span",{class:"muted"},"Sticker will be sent with this reply"),
    h("button",{class:"x", "aria-label":"Remove sticker", onclick:()=>{ withSticker[uid]=false; renderAttach(); }}, "×")));
}
async function sendReply(){
  const t=$("#reply"), text=t.value.trim(); if (!text || !uid) return;
  if (MODE==="offline"){
    const ts=new Date().toISOString();
    (OFF.local[uid] = OFF.local[uid]||[]).push({id:"l"+Date.now(), dir:"out", text, ts});
    OFF.chats[uid].draft = ""; Object.assign(OFF.families.find(x=>x.uid===uid), {last:text, last_ts:ts, last_out:true});
    t.value=""; autosize(t); load(); return;
  }
  $("#sendBtn").disabled = true;
  try { const r = await post("/api/reply",{uid, text, sticker: !!withSticker[uid]}); t.value=""; autosize(t);
        withSticker[uid]=false; renderAttach(); if (r.sent) toast("Sent on WhatsApp"); }
  catch(e){ toast(e.message); }
  $("#sendBtn").disabled = false; load();
}
async function refreshBio(){
  if (MODE==="offline"){ toast("Summary is up to date."); return; }
  try { await post("/api/copilot",{uid}); toast("Updating summary…"); } catch(e){ toast(e.message); }
}
function autosize(t){ t.style.height="auto"; t.style.height=Math.min(t.scrollHeight,140)+"px"; }

// Family phone (demo): a message from the family in the open chat
function renderSim(){
  const c = S && S.chat; if (!c) return;
  $("#simTitle").textContent = "Send as " + c.name;
  const chips=$("#simChips"); chips.replaceChildren();
  if (MODE==="offline"){
    const list = OFF.scripts[uid]||[], used = OFF.used[uid]||new Set();
    $("#simText").hidden = true; $("#simSend").hidden = true;
    $("#simNote").textContent = !list.length ? "No recorded messages for this chat." : used.size===list.length ? "All recorded messages sent." : "Choose a message:";
    list.forEach((s,i)=>{ if (!used.has(i)) chips.append(h("button",{onclick:()=>{ offlineSendFamily(i); renderSim(); }}, s.text)); });
  } else {
    $("#simText").hidden = false; $("#simSend").hidden = false; $("#simNote").textContent = "";
    for (const t of (SUGGEST[c.name]||[])) chips.append(h("button",{onclick:()=>{ $("#simText").value=t; $("#simText").focus(); }}, t));
  }
}
async function simSend(){
  const text=$("#simText").value.trim(); if (!text || !uid) return;
  try { await post("/api/simulate",{uid, text}); $("#simText").value=""; } catch(e){ toast(e.message); }
}

// Settings
function renderSettings(){
  const b=$("#setBody"); b.replaceChildren();
  const url = h("input",{type:"url", placeholder:"https://your-server.onrender.com", value:CONN.base||""});
  const tok = h("input",{type:"password", placeholder:"Access token"});
  const connect = async ()=>{
    const base=url.value.trim().replace(/\/+$/,"");
    if (!/^https:\/\/|^http:\/\/(localhost|127\.0\.0\.1)(:|\/|$)/.test(base)){ toast("Use an https:// address"); return; }
    const prev={MODE, CONN}; CONN={base, token:tok.value.trim()}; MODE="remote";
    try { const r=await fetch(base+"/api/state",{headers:headers()}); if(!r.ok) throw new Error(r.status===401?"wrong token":"HTTP "+r.status);
      sset("npw_conn", JSON.stringify(CONN)); uid=null; await load(); startEvents(); $("#setPop").hidden=true; toast("Connected"); renderSim(); }
    catch(e){ MODE=prev.MODE; CONN=prev.CONN; toast("Couldn't connect: "+e.message); }
  };
  if (MODE==="local"){ b.append(h("p",{class:"muted", style:"margin:0"},"Connected to this computer's server.")); }
  else if (MODE==="remote"){ let host=CONN.base; try{host=new URL(CONN.base).host;}catch(e){}
    b.append(h("p",{class:"muted", style:"margin:0"},"Connected to ", h("b",{},host)),
      h("div",{class:"row2"}, h("button",{class:"btn", onclick:()=>{ sset("npw_conn",null); CONN={base:"",token:""}; uid=null; startOffline(); $("#setPop").hidden=true; }}, "Disconnect"))); }
  else { b.append(h("p",{class:"muted", style:"margin:0"},"Offline demo. Connect a server to process new messages."),
           h("label",{}, "Server address", url), h("label",{}, "Access token", tok), h("div",{class:"row2"}, h("button",{class:"btn primary", onclick:connect}, "Connect"))); }
  if (MODE!=="offline" && S && S.config){
    const sel = h("select",{}, [["auto_with_audit","Automatic, AI-checked"],["review_first","Nurse checks every update"],["shadow","Shadow (log only)"]]
      .map(([v,l])=>h("option",{value:v, selected: S.config.rollout_mode===v ? "" : false}, l)));
    sel.addEventListener("change", async()=>{ await post("/api/settings",{rollout_mode:sel.value}); toast("Saved"); load(); });
    const on = S.config.kill_switch==="on";
    b.append(h("label",{}, "Profile updates", sel), h("div",{class:"row2"},
      h("button",{class:"btn "+(on?"primary":"danger"), onclick:async()=>{ await post("/api/settings",{kill_switch: on?"off":"on"}); await load(); renderSettings(); }},
        on ? "Resume profile updates" : "Pause all profile updates"),
      h("button",{class:"btn", onclick:async()=>{ await post("/api/reset"); uid=null; prevVals={}; dismissed={}; await load(); toast("Demo reset"); }}, "Reset demo")),
      S.config.spend_cap_usd ? h("p",{class:"muted", style:"margin:0"}, `API spend $${(S.config.spend_usd||0).toFixed(2)} of $${S.config.spend_cap_usd.toFixed(0)}`) : null);
  }
}

// ------------------------------------------------------------------ live updates (server-sent events over fetch, token in a header)
let evAbort=null, pending=null;
function soon(){ clearTimeout(pending); pending=setTimeout(load, 150); }
function stopEvents(){ if (evAbort){ evAbort.abort(); evAbort=null; } }
async function startEvents(){
  stopEvents(); const ctl=new AbortController(); evAbort=ctl;
  try {
    const r = await fetch(CONN.base+"/events",{headers:headers(), signal:ctl.signal});
    const rd = r.body.getReader(), dec=new TextDecoder(); let buf="";
    for(;;){ const {value,done}=await rd.read(); if(done) break; buf+=dec.decode(value,{stream:true}); let i;
      while((i=buf.indexOf("\n\n"))>=0){ const chunk=buf.slice(0,i); buf=buf.slice(i+2);
        const line=chunk.split("\n").find(l=>l.startsWith("data: ")); if(!line) continue;
        const {kind,data}=JSON.parse(line.slice(6));
        if (kind==="family_erased" && data.uid===uid) uid=null;
        if (kind==="reset"){ prevVals={}; dismissed={}; }
        if (kind==="profile" && data.uid===uid) post("/api/read",{uid}).catch(()=>{});
        soon(); } }
  } catch(e){ if (ctl.signal.aborted) return; }
  if (evAbort===ctl && MODE!=="offline") setTimeout(startEvents, 2000);
}

// ------------------------------------------------------------------ wiring
$("#sendBtn").addEventListener("click", sendReply);
$("#reply").addEventListener("input", e=>autosize(e.target));
$("#reply").addEventListener("keydown", e=>{ if (e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendReply(); } });
$("#search").addEventListener("input", e=>{ query=e.target.value.trim().toLowerCase(); renderList(); });
document.querySelectorAll(".filters .chip").forEach(b=>b.addEventListener("click",()=>{ filter=b.dataset.filter;
  document.querySelectorAll(".filters .chip").forEach(x=>x.classList.toggle("on",x===b)); renderList(); }));
document.querySelectorAll(".cp-tabs button").forEach(b=>b.addEventListener("click",()=>{ cpTab=b.dataset.tab;
  document.querySelectorAll(".cp-tabs button").forEach(x=>x.classList.toggle("on",x===b)); $("#cpProfile").hidden=cpTab!=="profile"; $("#cpHow").hidden=cpTab!=="how"; }));
$("#simBtn").addEventListener("click",()=>{ $("#simPop").hidden=!$("#simPop").hidden; renderSim(); });
$("#simClose").addEventListener("click",()=>{ $("#simPop").hidden=true; });
$("#simSend").addEventListener("click", simSend);
$("#simText").addEventListener("keydown", e=>{ if (e.key==="Enter" && !e.shiftKey){ e.preventDefault(); simSend(); } });
$("#setBtn").addEventListener("click",()=>{ $("#setPop").hidden=!$("#setPop").hidden; renderSettings(); });
$("#setClose").addEventListener("click",()=>{ $("#setPop").hidden=true; });

async function loadSuggest(){ try { const d=await (await fetch(CONN.base ? "demo.json" : "demo.json")).json();
  for (const f of d.families) SUGGEST[f.name]=(d.scripts[f.uid]||[]).map(s=>s.text); } catch(e){} }
(async function boot(){
  if (!window.NPW_OFFLINE_ONLY){
    try { const r=await fetch("api/state",{credentials:"same-origin"});
      if (r.ok && (r.headers.get("content-type")||"").includes("json")){ MODE="local"; S=await r.json(); uid=S.uid; render(); startEvents(); loadSuggest(); return; } } catch(e){}
    const saved=sget("npw_conn");
    if (saved){ try { CONN=JSON.parse(saved); MODE="remote"; await load(); if (MODE==="remote"){ startEvents(); loadSuggest(); return; } } catch(e){} }
  }
  startOffline();
})();
</script>

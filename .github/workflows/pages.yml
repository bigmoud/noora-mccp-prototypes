# Publishes profile-writer/web/ (the dashboard: Replay mode + Connect to live server) to GitHub Pages.
# One-time setup by a repo admin: Settings → Pages → Source: "GitHub Actions".
# Private repos need a paid GitHub plan for Pages; otherwise use Netlify (see docs/DEPLOY.md).
name: Deploy dashboard to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["profile-writer/web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to publish anything that looks like a key
        run: "! grep -rIE 'sk-ant-|EAAG[A-Za-z0-9]{20,}' profile-writer/web/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: profile-writer/web
      - id: deployment
        uses: actions/deploy-pages@v4
